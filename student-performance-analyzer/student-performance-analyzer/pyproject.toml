[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "student-performance-analyzer"
version = "1.0.0"
description = "A terminal tool that analyses student marks from a CSV file."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []          # standard library only - nothing extra to install

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
student-analyzer = "student_analyzer.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]       # lets `pytest` find the package without installing it first
